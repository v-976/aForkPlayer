<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><title>ForkPlayer PWA — проверка совместимости</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101828;color:#f8fafc}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:860px;margin-inline:auto}header{padding:24px 0 12px}h1{font-size:1.5rem;margin:0}p{color:#aebdd0;line-height:1.5}.panel{background:#1b293c;border-radius:16px;padding:16px;margin:16px 0}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;border:1px solid #63758a;background:#101828;color:white;font-size:16px}button{margin-top:12px;padding:12px 18px;background:#5e8cff;color:#0b1020;border:0;border-radius:10px;font-weight:700;font-size:16px}video{display:block;width:100%;aspect-ratio:16/9;background:black;border-radius:10px}small{color:#aebdd0}#status{white-space:pre-wrap}
</style></head><body><header><h1>ForkPlayer PWA</h1><p>Этап 1 — проверка iPhone/iPad. Это тест видеовоспроизведения, а не готовый каталог ForkPlayer.</p></header><main><section class="panel"><label for="url">Прямая HTTPS-ссылка на MP4 или HLS (.m3u8)</label><input id="url" type="url" inputmode="url" placeholder="https://example.com/video.m3u8" autocomplete="off" spellcheck="false"><button id="play">Открыть видео</button><p id="status" role="status">Готов к проверке.</p></section><section class="panel"><video id="video" controls playsinline webkit-playsinline preload="none"></video><p><small>На iOS воспроизведение зависит от кодека, сервера, CORS и поддержки формата Safari. HTTP и произвольные IPTV-протоколы не поддерживаются этим прототипом.</small></p></section></main><script>
"use strict";
const video=document.getElementById("video"),status=document.getElementById("status");
document.getElementById("play").addEventListener("click",()=>{
 const value=document.getElementById("url").value.trim();
 let u;try{u=new URL(value)}catch{status.textContent="Некорректный URL";return}
 if(u.protocol!=="https:"){status.textContent="Разрешены только HTTPS-ссылки";return}
 video.pause();video.removeAttribute("src");video.load();video.src=u.href;
 status.textContent="Загружаю поток…";video.play().catch(e=>{status.textContent="Автозапуск не удался: "+e.message+"; попробуй кнопку Play в плеере."});
});
video.addEventListener("playing",()=>status.textContent="Воспроизведение началось.");
video.addEventListener("error",()=>status.textContent="Ошибка видео: поток, кодек или доступ к ресурсу не поддерживаются.");
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
