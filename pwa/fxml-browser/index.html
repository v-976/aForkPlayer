<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>aForkPlayer · FXML</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#101828;color:#f6f8ff}*{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 24px)}main{max-width:780px;margin:auto}h1{font-size:1.4rem}p{line-height:1.45;color:#becce1}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#5e8cff;color:#081324;border:0;border-radius:10px;padding:12px;font:600 16px system-ui}button:disabled{opacity:.5}.card{background:#1e2c42;border:1px solid #33445e;border-radius:13px;margin:10px 0;padding:13px;width:100%;text-align:left;color:white}.card strong{display:block;font-size:17px}.card small{display:block;color:#c3d0e0;margin-top:5px;overflow-wrap:anywhere}.panel{background:#1b293c;padding:14px;border-radius:13px;margin:14px 0}.warn{color:#ffd19a}.ok{color:#a5f2bf}a{color:#9bbcff}code{overflow-wrap:anywhere}#items{padding-bottom:12px}input{font-size:16px;background:#0d192c;border:1px solid #506480;border-radius:8px;color:white;padding:11px;width:100%}video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9}#playerBox[hidden]{display:none}#debug{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style></head><body><main><h1>aForkPlayer · фильмы и сериалы</h1><p>Каталог оригинального FXML PARSERS. Выбери фильм или сериал, затем доступный источник воспроизведения.</p><div class="bar"><button id="back" disabled>← Назад</button><button id="home">Главный каталог</button></div><div class="panel"><strong id="heading">FXML PARSERS</strong><p id="status" role="status">Ожидание загрузки…</p><div id="searchBox" hidden><input id="search" placeholder="Поиск по каталогу"><button id="searchGo">Искать</button></div></div><section class="panel" id="playerBox" hidden><strong id="playerTitle">Видео</strong><video id="player" controls playsinline webkit-playsinline preload="none"></video><p id="playerStatus"></p><button id="closePlayer">Закрыть плеер</button></section><div id="items"></div><details><summary>Технические сведения</summary><pre id="debug"></pre></details></main><script>
"use strict";
const ROOT="https://cloud.fxmlparsers.in.net/";
const heading=document.getElementById("heading"),status=document.getElementById("status"),items=document.getElementById("items"),back=document.getElementById("back"),searchBox=document.getElementById("searchBox"),search=document.getElementById("search"),debug=document.getElementById("debug");
let history=[],active=ROOT,activeTitle="FXML PARSERS",searchTemplate=null,sequence=0;
const playerBox=document.getElementById("playerBox"),player=document.getElementById("player"),playerStatus=document.getElementById("playerStatus"),playerTitle=document.getElementById("playerTitle");
function closePlayer(){document.getElementById("youtubeFrame")?.remove();player.hidden=false;player.pause();player.removeAttribute("src");player.load();playerBox.hidden=true}
document.getElementById("closePlayer").onclick=closePlayer;
player.addEventListener("playing",()=>playerStatus.textContent="Воспроизведение началось.");
player.addEventListener("error",()=>playerStatus.textContent="Safari не смог воспроизвести поток. Возможны ограничения сервера, формата или кодека.");
function isVideo(u){return /\.(mp4|m4v|mov|m3u8|mpd)(?:$|[?#])/i.test(u.pathname+u.search+u.hash)}
function playVideo(raw,title,base){const u=normalize(raw,base);if(!u||u.protocol!=="https:"){line("Для видео требуется прямая HTTPS-ссылка.","warn");return}if(/\.mpd(?:$|[?#])/i.test(u.href)){line("Источник использует MPEG-DASH. Встроенный Safari не поддерживает этот формат напрямую.","warn");return}closePlayer();playerBox.hidden=false;playerTitle.textContent=title;playerStatus.textContent="Открываю поток в Safari…";player.src=u.href;playerBox.scrollIntoView({behavior:"smooth",block:"start"});player.play().catch(()=>{playerStatus.textContent="Нажми Play в плеере. Если не запускается, источник может требовать другой протокол или авторизацию."})}
function decodeEntities(s){const e=document.createElement("textarea");e.innerHTML=String(s);return e.value}
function isBackCommand(s){return /^cmd:historyback\(1\);?$/i.test(s.trim())}
function isSearchUrl(s){return s.includes("{search}")}
function normalize(raw,base){try{const u=new URL(raw,base);if(u.protocol==="http:"&&["fxmlparsers.in.net","cloud.fxmlparsers.in.net","p3.fxmlparsers.in.net","ru.fxmlparsers.in.net"].includes(u.hostname))u.protocol="https:";return u}catch{return null}}
function label(v){return decodeEntities(String(v??"").replace(/<[^>]*>/g," ")).trim()}
function isCommand(s){return /^\s*(alert|javascript|menu|search):?\s*\(/i.test(s)||/^\s*(alert|javascript)\s*:/i.test(s)}
function line(msg,kind){status.textContent=msg;status.className=kind||""}
function makeCard(entry,base){
 const title=label(entry.title)||"Без названия";
 const stream=String(entry.stream_url||entry.video_url||entry.file_url||"").trim();
 const raw=String(entry.playlist_url||stream||"").trim();
 if(!title&&!raw)return;
 const el=document.createElement("button");el.className="card";
 const strong=document.createElement("strong");strong.textContent=title;el.append(strong);
 const detail=document.createElement("small");
 detail.textContent=stream?"Видеоссылка · проверить":isBackCommand(raw)?"Вернуться назад":isSearchUrl(raw)?"Поиск по источнику":raw&&isCommand(raw)?"Информация":raw?"Открыть раздел / источник":"Информационный элемент";
 el.append(detail);
 el.addEventListener("click",()=>{
  if(isBackCommand(raw)){if(history.length)back.click();else line("Вы уже в главном каталоге.","warn");return}
  if(isSearchUrl(raw)){const q=prompt("Название фильма или сериала:");if(q===null||!q.trim())return;const u=normalize(raw.replace(/\{search\}/g,encodeURIComponent(q.trim())),base);if(u&&u.protocol==="https:"&&u.hostname==="cloud.fxmlparsers.in.net")openCatalog(u.href,true,"Поиск: "+q.trim());else line("Поисковый адрес недоступен по HTTPS.","warn");return}
  if(!raw||isCommand(raw)){line("Служебный элемент FXML. Код портала не выполняется.","warn");return}
  const u=normalize(raw,base);if(!u){line("Некорректный адрес.","warn");return}
  if(["youtube.com","www.youtube.com","m.youtube.com","youtu.be"].includes(u.hostname)){
   const id=u.hostname==="youtu.be"?u.pathname.slice(1):u.searchParams.get("v");
   if(!id||!/^[a-zA-Z0-9_-]{11}$/.test(id)){line("Некорректная ссылка YouTube.","warn");return}
   closePlayer();playerBox.hidden=false;playerTitle.textContent=title;
   playerStatus.textContent="Трейлер YouTube внутри aForkPlayer. Нажми Play.";
   const frame=document.createElement("iframe");frame.id="youtubeFrame";
   frame.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?playsinline=1&rel=0";
   frame.title=title;frame.allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";
   frame.allowFullscreen=true;frame.referrerPolicy="strict-origin-when-cross-origin";
   frame.style.cssText="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:black";
   player.hidden=true;player.after(frame);playerBox.scrollIntoView({behavior:"smooth",block:"start"});
   return;
  }
  if(stream||isVideo(u)){playVideo(stream||raw,title,base);return}
  if(u.protocol!=="https:"){line("HTTP-ссылка недоступна из защищённой PWA.","warn");return}
  if(u.hostname!=="cloud.fxmlparsers.in.net"){line("Источник вне FXML-зеркала: "+u.hostname+". Прямой запрос не выполняется; требуется проверенный HTTPS FXML API либо прямой поток.","warn");return}
  openCatalog(u.href,true,title);
 });
 items.append(el);
}
async function openCatalog(url,push=true,title="FXML PARSERS"){const id=++sequence,prev=active;closePlayer();items.replaceChildren();searchBox.hidden=true;searchTemplate=null;heading.textContent=title;line("Загружаю настоящий FXML…");if(push&&prev!==url)history.push({url:prev,title:activeTitle});active=url;activeTitle=title;back.disabled=!history.length;const start=performance.now();try{const r=await fetch(url,{mode:"cors",credentials:"omit",redirect:"follow",signal:AbortSignal.timeout(15000)});if(id!==sequence)return;const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw Error("Ответ не является JSON (HTTP "+r.status+")")}if(!r.ok)throw Error("HTTP "+r.status);const channels=Array.isArray(data.channels)?data.channels:[];debug.textContent=JSON.stringify({url,finalUrl:r.url,status:r.status,contentType:r.headers.get("content-type"),bytes:body.length,channels:channels.length,elapsedMs:Math.round(performance.now()-start)},null,2);const base=r.url||url;for(const ch of channels)makeCard(ch,base);if(typeof data.next_page_url==="string"&&data.next_page_url){makeCard({title:"Следующая страница →",playlist_url:data.next_page_url},base)}searchTemplate=typeof data.search_on==="string"?data.search_on:null;if(searchTemplate)searchBox.hidden=false;line("Получено элементов: "+channels.length+". Для просмотра выбери источник с прямым видеопотоком.","ok");if(!channels.length)line("JSON получен, но список channels пуст. Смотри технические сведения.","warn")}catch(e){if(id!==sequence)return;debug.textContent=JSON.stringify({url,error:String(e)},null,2);line("Не удалось загрузить раздел: "+e.message+". Возможны CORS, HTTP-перенаправление или недоступность сервера.","warn")}}
back.onclick=()=>{if(history.length){const previous=history.pop();openCatalog(previous.url,false,previous.title)}};
document.getElementById("home").onclick=()=>{history=[];openCatalog(ROOT,false,"FXML PARSERS")};
document.getElementById("searchGo").onclick=()=>{if(!searchTemplate)return;const q=search.value.trim();if(!q)return;const url=searchTemplate.replace(/\{search\}/g,encodeURIComponent(q));const u=normalize(url,active);if(u&&u.protocol==="https:"&&["fxmlparsers.in.net","cloud.fxmlparsers.in.net"].includes(u.hostname))openCatalog(u.href,true,"Поиск: "+q);else line("Поиск использует неподдерживаемый адрес.","warn")};
openCatalog(ROOT,false);
</script></body></html>
