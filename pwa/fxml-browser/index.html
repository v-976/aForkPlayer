<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>aForkPlayer · FXML</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#101828;color:#f6f8ff}*{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 24px)}main{max-width:780px;margin:auto}h1{font-size:1.4rem}p{line-height:1.45;color:#becce1}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#5e8cff;color:#081324;border:0;border-radius:10px;padding:12px;font:600 16px system-ui}button:disabled{opacity:.5}.card{background:#1e2c42;border:1px solid #33445e;border-radius:13px;margin:10px 0;padding:13px;width:100%;text-align:left;color:white}.card strong{display:block;font-size:17px}.card small{display:block;color:#c3d0e0;margin-top:5px;overflow-wrap:anywhere}.panel{background:#1b293c;padding:14px;border-radius:13px;margin:14px 0}.warn{color:#ffd19a}.ok{color:#a5f2bf}a{color:#9bbcff}code{overflow-wrap:anywhere}#items{padding-bottom:12px}input{font-size:16px;background:#0d192c;border:1px solid #506480;border-radius:8px;color:white;padding:11px;width:100%}#debug{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style></head><body><main><h1>aForkPlayer · настоящий FXML</h1><p>Экспериментальная навигация по оригинальному каталогу FXML PARSERS. Без сторонних источников и демонстрационных роликов.</p><div class="bar"><button id="back" disabled>← Назад</button><button id="home">Главный каталог</button></div><div class="panel"><strong id="heading">FXML PARSERS</strong><p id="status" role="status">Ожидание загрузки…</p><div id="searchBox" hidden><input id="search" placeholder="Поиск по каталогу"><button id="searchGo">Искать</button></div></div><div id="items"></div><details><summary>Технические сведения</summary><pre id="debug"></pre></details></main><script>
"use strict";
const ROOT="https://cloud.fxmlparsers.in.net/";
const heading=document.getElementById("heading"),status=document.getElementById("status"),items=document.getElementById("items"),back=document.getElementById("back"),searchBox=document.getElementById("searchBox"),search=document.getElementById("search"),debug=document.getElementById("debug");
let history=[],active=ROOT,searchTemplate=null,sequence=0;
function normalize(raw,base){try{const u=new URL(raw,base);if(u.protocol==="http:"&&["fxmlparsers.in.net","cloud.fxmlparsers.in.net","p3.fxmlparsers.in.net","ru.fxmlparsers.in.net"].includes(u.hostname))u.protocol="https:";return u}catch{return null}}
function label(v){return String(v??"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").trim()}
function isCommand(s){return /^\s*(alert|javascript|menu|search):?\s*\(/i.test(s)||/^\s*(alert|javascript)\s*:/i.test(s)}
function line(msg,kind){status.textContent=msg;status.className=kind||""}
function makeCard(entry,base){const raw=String(entry.playlist_url||entry.stream_url||"").trim(),title=label(entry.title)||"Без названия";if(!title&&!raw)return;const el=document.createElement("button");el.className="card";const strong=document.createElement("strong");strong.textContent=title;el.append(strong);const detail=document.createElement("small");detail.textContent=raw?(raw.length>140?raw.slice(0,140)+"…":raw):"Информационный элемент";el.append(detail);el.addEventListener("click",()=>{if(!raw||isCommand(raw)){line("Служебный элемент FXML: команда не выполняется.","warn");return}const u=normalize(raw,base);if(!u){line("Неизвестный адрес раздела.","warn");return}if(u.protocol!=="https:"){line("Раздел использует "+u.protocol+" — прямой запрос из HTTPS-PWA заблокирован. Адрес: "+u.href,"warn");return}if(!["fxmlparsers.in.net","cloud.fxmlparsers.in.net","p3.fxmlparsers.in.net","ru.fxmlparsers.in.net"].includes(u.hostname)){line("Внешний источник: "+u.hostname+". Автоматическая загрузка отключена до отдельной проверки.","warn");return}openCatalog(u.href,true,title)});items.append(el)}
async function openCatalog(url,push=true,title="FXML PARSERS"){const id=++sequence,prev=active;items.replaceChildren();searchBox.hidden=true;searchTemplate=null;heading.textContent=title;line("Загружаю настоящий FXML…");if(push&&prev!==url)history.push(prev);active=url;back.disabled=!history.length;const start=performance.now();try{const r=await fetch(url,{mode:"cors",credentials:"omit",redirect:"follow",signal:AbortSignal.timeout(15000)});if(id!==sequence)return;const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw Error("Ответ не является JSON (HTTP "+r.status+")")}if(!r.ok)throw Error("HTTP "+r.status);const channels=Array.isArray(data.channels)?data.channels:[];debug.textContent=JSON.stringify({url,finalUrl:r.url,status:r.status,contentType:r.headers.get("content-type"),bytes:body.length,channels:channels.length,elapsedMs:Math.round(performance.now()-start)},null,2);const base=r.url||url;for(const ch of channels)makeCard(ch,base);searchTemplate=typeof data.search_on==="string"?data.search_on:null;if(searchTemplate)searchBox.hidden=false;line("Получено элементов: "+channels.length,"ok");if(!channels.length)line("JSON получен, но список channels пуст. Смотри технические сведения.","warn")}catch(e){if(id!==sequence)return;debug.textContent=JSON.stringify({url,error:String(e)},null,2);line("Не удалось загрузить раздел: "+e.message+". Возможны CORS, HTTP-перенаправление или недоступность сервера.","warn")}}
back.onclick=()=>{if(history.length)openCatalog(history.pop(),false,"Предыдущий каталог")};
document.getElementById("home").onclick=()=>{history=[];openCatalog(ROOT,false,"FXML PARSERS")};
document.getElementById("searchGo").onclick=()=>{if(!searchTemplate)return;const q=search.value.trim();if(!q)return;const url=searchTemplate.replace(/\{search\}/g,encodeURIComponent(q));const u=normalize(url,active);if(u&&u.protocol==="https:"&&["fxmlparsers.in.net","cloud.fxmlparsers.in.net"].includes(u.hostname))openCatalog(u.href,true,"Поиск: "+q);else line("Поиск использует неподдерживаемый адрес.","warn")};
openCatalog(ROOT,false);
</script></body></html>
